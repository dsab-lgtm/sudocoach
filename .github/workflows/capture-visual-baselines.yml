name: Capture visual baselines

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    name: Capture Ubuntu screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/ui-regression.spec.ts --update-snapshots
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4
        with:
          name: ui-regression-linux-baselines
          path: e2e/ui-regression.spec.ts-snapshots/*-linux.png
          if-no-files-found: error
